name: Zizmor (Actions security lint)

# GHA-PIN-1 (site repo GATES-SHIFTLEFT-BUILD-SPEC.md §3, cross-repo fence):
# closes the "mutable action tag in a runner holding deploy credentials"
# exposure — this repo's `deploy` job holds CLOUDFLARE_API_TOKEN. Checks
# every workflow keeps its third-party actions SHA-pinned, has no over-broad
# `permissions:`, and has no script-injection sinks.

on:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
